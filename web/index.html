<!doctype html>
<html lang="{{.Lang}}" dir="{{.Dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{t .Lang "app.title"}}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-tab-shape="{{.TabShape}}">
  <header class="toolbar">
    <div class="brand">
      <img src="/static/icon.svg" alt="" width="28" height="28">
      <span class="brand-name">{{t .Lang "app.title"}}</span>
      <span class="brand-tagline">{{t .Lang "app.tagline"}}</span>
    </div>
    <form class="prefs" method="get" action="/">
      <label>
        <span>{{t .Lang "toolbar.language"}}</span>
        <select name="lang" data-autosubmit>
          {{range .Languages}}<option value="{{.Code}}"{{if eq .Code $.Lang}} selected{{end}}>{{.Name}}</option>{{end}}
        </select>
      </label>
      <label>
        <span>{{t .Lang "toolbar.theme"}}</span>
        <select name="theme" data-autosubmit>
          {{range .Themes}}<option value="{{.ID}}"{{if eq .ID $.Theme.ID}} selected{{end}}>{{.Name}}</option>{{end}}
        </select>
      </label>
      <noscript><button type="submit">OK</button></noscript>
    </form>
  </header>

  <main class="desk">
    <div class="binder" id="binder" data-section="calendar" data-lang="{{.Lang}}" data-week-start="{{.WeekStart}}" data-alphabet="{{.Alphabet}}">
      <div class="cover">
        <div class="spread">
          <section class="page page-start" id="page-start" aria-live="polite"></section>
          <div class="rings" aria-hidden="true">
            <span class="ring"></span><span class="ring"></span><span class="ring"></span>
            <span class="ring"></span><span class="ring"></span><span class="ring"></span>
          </div>
          <section class="page page-end" id="page-end"></section>
        </div>
        <nav class="tabs" aria-label="{{t .Lang "tabs.label"}}">
          {{range .Tabs}}<button type="button" class="tab" data-tab="{{.ID}}" data-paper="{{.Paper}}"><span>{{.Label}}</span></button>{{end}}
        </nav>
      </div>
    </div>
  </main>

  <dialog class="event-dialog" id="event-dialog">
    <form method="dialog" novalidate>
      <h2 class="dialog-title"></h2>
      <label class="wide">{{t .Lang "event.title"}}<input name="title" required maxlength="500" autocomplete="off"></label>
      <label class="check"><input type="checkbox" name="allDay"> {{t .Lang "event.allDay"}}</label>
      <div class="row">
        <label>{{t .Lang "event.date"}}<input type="date" name="date" required></label>
        <label class="time-only">{{t .Lang "event.start"}}<input type="time" name="start"></label>
      </div>
      <div class="row">
        <label>{{t .Lang "event.endDate"}}<input type="date" name="endDate"></label>
        <label class="time-only">{{t .Lang "event.end"}}<input type="time" name="end"></label>
      </div>
      <label class="wide">{{t .Lang "event.location"}}<input name="location" maxlength="500" autocomplete="off"></label>
      <label class="wide">{{t .Lang "event.notes"}}<textarea name="notes" rows="3" maxlength="20000"></textarea></label>
      <p class="dialog-error" role="alert"></p>
      <div class="buttons">
        <button type="button" class="danger" data-action="delete">{{t .Lang "event.delete"}}</button>
        <span class="spacer"></span>
        <button type="submit" value="cancel" formnovalidate>{{t .Lang "event.cancel"}}</button>
        <button type="submit" value="save" class="primary">{{t .Lang "event.save"}}</button>
      </div>
    </form>
  </dialog>

  <dialog class="event-dialog task-dialog" id="task-dialog">
    <form method="dialog" novalidate>
      <h2 class="dialog-title"></h2>
      <label class="wide">{{t .Lang "task.title"}}<input name="title" required maxlength="500" autocomplete="off"></label>
      <div class="row">
        <label>{{t .Lang "task.due"}}<input type="date" name="due"></label>
        <label>{{t .Lang "task.priority"}}<select name="priority">
          <option value="0">{{t .Lang "task.priority0"}}</option>
          <option value="1">{{t .Lang "task.priority1"}}</option>
          <option value="2">{{t .Lang "task.priority2"}}</option>
          <option value="3">{{t .Lang "task.priority3"}}</option>
        </select></label>
      </div>
      <label class="check"><input type="checkbox" name="done"> {{t .Lang "task.isDone"}}</label>
      <label class="wide">{{t .Lang "event.notes"}}<textarea name="notes" rows="3" maxlength="20000"></textarea></label>
      <p class="dialog-error" role="alert"></p>
      <div class="buttons">
        <button type="button" class="danger" data-action="delete">{{t .Lang "event.delete"}}</button>
        <span class="spacer"></span>
        <button type="submit" value="cancel" formnovalidate>{{t .Lang "event.cancel"}}</button>
        <button type="submit" value="save" class="primary">{{t .Lang "event.save"}}</button>
      </div>
    </form>
  </dialog>

  <dialog class="event-dialog contact-dialog" id="contact-dialog">
    <form method="dialog" novalidate>
      <h2 class="dialog-title"></h2>
      <div class="row">
        <label>{{t .Lang "contact.givenName"}}<input name="givenName" maxlength="500" autocomplete="off"></label>
        <label>{{t .Lang "contact.familyName"}}<input name="familyName" maxlength="500" autocomplete="off"></label>
      </div>
      <div class="row">
        <label>{{t .Lang "contact.organization"}}<input name="organization" maxlength="500" autocomplete="off"></label>
        <label>{{t .Lang "contact.jobTitle"}}<input name="jobTitle" maxlength="500" autocomplete="off"></label>
      </div>
      <fieldset>
        <legend>{{t .Lang "contact.fields"}}</legend>
        <div class="fields"></div>
        <div class="add-fields">
          <button type="button" data-add-field="phone">+ {{t .Lang "contact.kind.phone"}}</button>
          <button type="button" data-add-field="email">+ {{t .Lang "contact.kind.email"}}</button>
          <button type="button" data-add-field="address">+ {{t .Lang "contact.kind.address"}}</button>
          <button type="button" data-add-field="url">+ {{t .Lang "contact.kind.url"}}</button>
        </div>
      </fieldset>
      <div class="row">
        <label>{{t .Lang "contact.birthday"}}<input type="date" name="birthday"></label>
        <label class="check"><input type="checkbox" name="noYear"> {{t .Lang "contact.noYear"}}</label>
      </div>
      <label class="wide">{{t .Lang "event.notes"}}<textarea name="notes" rows="2" maxlength="20000"></textarea></label>
      <datalist id="contact-labels">
        <option value="{{t .Lang "contact.label.work"}}"></option>
        <option value="{{t .Lang "contact.label.home"}}"></option>
        <option value="{{t .Lang "contact.label.mobile"}}"></option>
      </datalist>
      <p class="dialog-error" role="alert"></p>
      <div class="buttons">
        <button type="button" class="danger" data-action="delete">{{t .Lang "event.delete"}}</button>
        <span class="spacer"></span>
        <button type="submit" value="cancel" formnovalidate>{{t .Lang "event.cancel"}}</button>
        <button type="submit" value="save" class="primary">{{t .Lang "event.save"}}</button>
      </div>
    </form>
  </dialog>

  <dialog class="event-dialog planner-dialog" id="planner-dialog">
    <form method="dialog" novalidate>
      <h2 class="dialog-title"></h2>
      <label class="wide">{{t .Lang "planner.title"}}<input name="title" required maxlength="500" autocomplete="off"></label>
      <div class="row">
        <label>{{t .Lang "planner.firstDay"}}<input type="date" name="firstDay" required></label>
        <label>{{t .Lang "planner.lastDay"}}<input type="date" name="lastDay"></label>
      </div>
      <fieldset class="colors">
        <legend>{{t .Lang "planner.color"}}</legend>
          <label class="color-pick"><input type="radio" name="color" value="red"><span class="swatch c-red"></span></label>
          <label class="color-pick"><input type="radio" name="color" value="orange"><span class="swatch c-orange"></span></label>
          <label class="color-pick"><input type="radio" name="color" value="green"><span class="swatch c-green"></span></label>
          <label class="color-pick"><input type="radio" name="color" value="blue"><span class="swatch c-blue"></span></label>
          <label class="color-pick"><input type="radio" name="color" value="purple"><span class="swatch c-purple"></span></label>
          <label class="color-pick"><input type="radio" name="color" value="brown"><span class="swatch c-brown"></span></label>
      </fieldset>
      <p class="dialog-error" role="alert"></p>
      <div class="buttons">
        <button type="button" class="danger" data-action="delete">{{t .Lang "event.delete"}}</button>
        <span class="spacer"></span>
        <button type="submit" value="cancel" formnovalidate>{{t .Lang "event.cancel"}}</button>
        <button type="submit" value="save" class="primary">{{t .Lang "event.save"}}</button>
      </div>
    </form>
  </dialog>

  <dialog class="event-dialog anniversary-dialog" id="anniversary-dialog">
    <form method="dialog" novalidate>
      <h2 class="dialog-title"></h2>
      <label class="wide">{{t .Lang "ann.title"}}<input name="title" required maxlength="500" autocomplete="off"></label>
      <div class="row">
        <label>{{t .Lang "ann.day"}}<input type="number" name="day" min="1" max="31" required></label>
        <label>{{t .Lang "ann.month"}}<select name="month"></select></label>
        <label>{{t .Lang "ann.year"}}<input type="number" name="year" min="1" max="9999"></label>
      </div>
      <p class="dialog-error" role="alert"></p>
      <div class="buttons">
        <button type="button" class="danger" data-action="delete">{{t .Lang "event.delete"}}</button>
        <span class="spacer"></span>
        <button type="submit" value="cancel" formnovalidate>{{t .Lang "event.cancel"}}</button>
        <button type="submit" value="save" class="primary">{{t .Lang "event.save"}}</button>
      </div>
    </form>
  </dialog>

  <footer class="footer">{{t .Lang "footer.license"}}</footer>
</body>
</html>
